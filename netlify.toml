# ---------- Security headers (apply to every response) ----------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), gyroscope=(), accelerometer=(), magnetometer=(), payment=(self)"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://js.stripe.com https://m.stripe.network https://m.stripe.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; frame-src 'self' https://www.google.com https://*.google.com https://js.stripe.com https://hooks.stripe.com https://www.googletagmanager.com https://challenges.cloudflare.com; connect-src 'self' https://api.postcodes.io https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://api.stripe.com https://m.stripe.network https://errors.stripe.com https://api.indexnow.org https://api.web3forms.com https://formsubmit.co https://challenges.cloudflare.com; form-action 'self' https://api.web3forms.com https://formsubmit.co; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

# Long-cache for static assets that have versioned filenames or rarely change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# sitemap.xml — explicit content-type to help GSC/Bing parsers
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Stripe webhook must allow POST from Stripe — no extra security headers
[[headers]]
  for = "/api/stripe-webhook"
  [headers.values]
    X-Frame-Options = "DENY"
